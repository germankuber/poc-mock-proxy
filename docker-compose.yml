name: poc-mock-proxy

x-bank: &bank
  BANK_BASE_URL: https://bank-fake:8443

x-proxy: &proxy
  HTTPS_PROXY: http://mock-proxy:8888

x-bank-only: &bank-only
  CA_BUNDLE: /certs/bundle-bank-only.crt

x-python: &python
  image: python:3.12-slim
  command: python /app/server.py
  volumes:
    - ./middleware-python/server.py:/app/server.py:ro
    - ./certs:/certs:ro

services:
  bank-fake:
    image: python:3.12-slim
    command: python /app/server.py
    volumes:
      - ./bank-fake/server.py:/app/server.py:ro
      - ./certs:/certs:ro

  mock-server:
    image: python:3.12-slim
    command: python /app/server.py
    volumes:
      - ./mock-server/server.py:/app/server.py:ro

  mock-proxy:
    image: mitmproxy/mitmproxy:11.0.2
    command: >
      mitmdump --listen-port 8888 --set connection_strategy=lazy --set confdir=/confdir -s /app/addon.py
    volumes:
      - ./mock-proxy/addon.py:/app/addon.py:ro
      - ./certs/mitm-confdir:/confdir
      - ./state:/state:ro
    depends_on:
      - mock-server

  middleware-python:
    <<: *python
    environment:
      <<: [*bank, *proxy]
    ports:
      - "9000:9000"
    depends_on:
      - bank-fake
      - mock-proxy

  middleware-python-no-dev-ca:
    <<: *python
    environment:
      <<: [*bank, *proxy, *bank-only]
    ports:
      - "9001:9000"
    depends_on:
      - bank-fake
      - mock-proxy

  middleware-python-prod:
    <<: *python
    environment:
      <<: [*bank, *bank-only]
    ports:
      - "9002:9000"
    depends_on:
      - bank-fake

  middleware-go:
    build: ./middleware-go
    image: poc-mock-proxy-middleware-go
    volumes:
      - ./certs:/certs:ro
    environment:
      <<: [*bank, *proxy]
    ports:
      - "9010:9000"
    depends_on:
      - bank-fake
      - mock-proxy

  middleware-go-no-dev-ca:
    image: poc-mock-proxy-middleware-go
    volumes:
      - ./certs:/certs:ro
    environment:
      <<: [*bank, *proxy, *bank-only]
    ports:
      - "9011:9000"
    depends_on:
      - bank-fake
      - mock-proxy

  middleware-go-prod:
    image: poc-mock-proxy-middleware-go
    volumes:
      - ./certs:/certs:ro
    environment:
      <<: [*bank, *bank-only]
    ports:
      - "9012:9000"
    depends_on:
      - bank-fake

  middleware-java:
    build: ./middleware-java
    image: poc-mock-proxy-middleware-java
    volumes:
      - ./certs:/certs:ro
    environment:
      <<: [*bank, *proxy]
    ports:
      - "9020:9000"
    depends_on:
      - bank-fake
      - mock-proxy

  middleware-java-no-dev-ca:
    image: poc-mock-proxy-middleware-java
    volumes:
      - ./certs:/certs:ro
    environment:
      <<: [*bank, *proxy, *bank-only]
    ports:
      - "9021:9000"
    depends_on:
      - bank-fake
      - mock-proxy

  middleware-java-prod:
    image: poc-mock-proxy-middleware-java
    volumes:
      - ./certs:/certs:ro
    environment:
      <<: [*bank, *bank-only]
    ports:
      - "9022:9000"
    depends_on:
      - bank-fake

  middleware-rust:
    build: ./middleware-rust
    image: poc-mock-proxy-middleware-rust
    volumes:
      - ./certs:/certs:ro
    environment:
      <<: [*bank, *proxy]
    ports:
      - "9030:9000"
    depends_on:
      - bank-fake
      - mock-proxy

  middleware-rust-no-dev-ca:
    image: poc-mock-proxy-middleware-rust
    volumes:
      - ./certs:/certs:ro
    environment:
      <<: [*bank, *proxy, *bank-only]
    ports:
      - "9031:9000"
    depends_on:
      - bank-fake
      - mock-proxy

  middleware-rust-prod:
    image: poc-mock-proxy-middleware-rust
    volumes:
      - ./certs:/certs:ro
