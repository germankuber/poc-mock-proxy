      - bank-fake

  middleware-dotnet:
    build: ./middleware-dotnet
    image: poc-mock-proxy-middleware-dotnet
    volumes:
      - ./certs:/certs:ro
    environment:
      <<: [*bank, *proxy]
    ports:
      - "9040:9000"
    depends_on:
      - bank-fake
      - mock-proxy

  middleware-dotnet-no-dev-ca:
    image: poc-mock-proxy-middleware-dotnet
    volumes:
      - ./certs:/certs:ro
    environment:
      <<: [*bank, *proxy, *bank-only]
    ports:
      - "9041:9000"
    depends_on:
      - bank-fake
      - mock-proxy

  middleware-dotnet-prod:
